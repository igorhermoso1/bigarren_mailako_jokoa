<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lit Zerbitzuak RPG</title>
  <link rel="stylesheet" href="css/web.css?v=20261103c">
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <div class="kuboa" aria-hidden="true"><div class="kuboa-gorputza">
        <i class="k-aurrea"></i><i class="k-atzea"></i><i class="k-eskuina"></i><i class="k-ezkerra"></i><i class="k-goia"></i><i class="k-behea"></i>
      </div></div>
      <h1 id="titulo" class="titulo">Lit Zerbitzuak RPG</h1>
    </div>
    <div id="musika" class="musika" hidden>
      <button type="button" id="m-jo" class="m-boton" aria-label="Musika piztu">▶</button>
      <button type="button" id="m-hurrengoa" class="m-boton" aria-label="Hurrengo abestia">⏭</button>
      <div class="m-pantaila">
        <span class="m-etiketa"><span class="m-ekualizadorea" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Orain jotzen</span>
        <div class="m-zinta" aria-live="polite"><span id="m-abestia">Sakatu ▶ musika entzuteko</span></div>
      </div>
      <input type="range" id="m-bolumena" class="m-bolumena" min="0" max="1" step="0.05" aria-label="Bolumena">
    </div>
    <button type="button" id="proiektorea" class="m-boton proiektore-botoia" title="Proiektore modua (klasean erakusteko)" aria-label="Proiektore modua">📽</button>
    <nav id="pestanas" class="estandartes" aria-label="Abenturak"></nav>
  </header>

  <main id="contenido" class="contenido">
    <section class="zona-mapa" aria-label="Mapa">
      <div id="mapa" class="marco-mapa"></div>
    </section>

    <aside class="lateral pergamino">
      <div class="lat-pestanas" role="tablist" aria-label="Alboko panela">
        <button type="button" role="tab" id="tab-taldeak" aria-controls="lat-taldeak" aria-selected="true">Taldeak</button>
        <button type="button" role="tab" id="tab-egunkaria" aria-controls="lat-egunkaria" aria-selected="false">Egunkaria</button>
        <button type="button" role="tab" id="tab-bitrina" aria-controls="lat-bitrina" aria-selected="false">Bitrina</button>
      </div>
      <div id="lat-taldeak" role="tabpanel" aria-labelledby="tab-taldeak" class="lat-cuerpo"></div>
      <div id="lat-egunkaria" role="tabpanel" aria-labelledby="tab-egunkaria" class="lat-cuerpo" hidden>
        <div class="filtros">
          <label>Taldea <select id="filtro-grupo"></select></label>
          <label>Mota <select id="filtro-tipo"></select></label>
        </div>
        <ol id="lista-eventos" class="cronica"></ol>
      </div>
      <div id="lat-bitrina" role="tabpanel" aria-labelledby="tab-bitrina" class="lat-cuerpo" hidden></div>
    </aside>
  </main>

  <script src="js/hasiera.js?v=20261103c"></script>
  <script src="js/motor.js?v=20261103c"></script>
  <script src="js/fx.js?v=20261103c"></script>
  <script src="js/mapa.js?v=20261103c"></script>
  <script src="js/app.js?v=20261103c"></script>
  <script src="js/musika.js?v=20261103c"></script>
</body>
</html>
