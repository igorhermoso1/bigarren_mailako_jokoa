<!doctype html>
<html lang="eu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abentura-mapa</title>
  <link rel="stylesheet" href="css/web.css">
</head>
<body>
  <header class="cabecera">
    <h1 id="titulo">Abentura-mapa</h1>
    <nav id="pestanas" class="pestanas" aria-label="Abenturak"></nav>
  </header>

  <main id="contenido" class="contenido">
    <section class="zona-mapa" aria-label="Mapa">
      <p id="descripcion" class="descripcion"></p>
      <div id="mapa" class="mapa"></div>
    </section>

    <aside id="panel" class="panel" aria-live="polite">
      <p>Sakatu talde bat edo lauki bat xehetasunak ikusteko.</p>
    </aside>

    <section class="taldeak" aria-labelledby="h-taldeak">
      <h2 id="h-taldeak">Taldeak</h2>
      <div id="tarjetas" class="tarjetas"></div>
    </section>

    <section class="egunkaria" aria-labelledby="h-egunkaria">
      <h2 id="h-egunkaria">Abentura-egunkaria</h2>
      <div class="filtros">
        <label>Taldea <select id="filtro-grupo"></select></label>
        <label>Mota <select id="filtro-tipo"></select></label>
      </div>
      <ol id="lista-eventos" class="lista-eventos"></ol>
    </section>
  </main>

  <script src="js/motor.js"></script>
  <script src="js/mapa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
